name: Build NetHunter Kernel

on:
  push:
    branches: [ sapphire ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev zip python3

    - name: Clone Toolchain (Weeb GCC + Clang)
      run: |
        # تحميل أداة Weeb Kernel GCC (للتعامل مع مكتبات ARM)
        git clone --depth=1 https://github.com/WeebKernel/WeebGCC.git -b master gcc
        # تحميل أداة Clang من Google (أكثر استقراراً)
        mkdir clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r498229.tar.gz -O clang.tar.gz
        tar -xzf clang.tar.gz -C clang
        rm clang.tar.gz

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        # استخدام GCC من WeebKernel و Clang من Google
        export PATH=$(pwd)/clang/bin:$(pwd)/gcc/bin:$PATH
        export CROSS_COMPILE=$(pwd)/gcc/bin/aarch64-linux-android-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        make O=out defconfig
        make -j$(nproc) O=out

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: out/arch/arm64/boot/Image.gz-dtb
