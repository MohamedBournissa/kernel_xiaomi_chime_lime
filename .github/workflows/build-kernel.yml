name: Build lime Kernel with ath9k_htc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ursinia
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev libelf-dev dwarves \
            python3 python-is-python3

      - name: Download Clang toolchain
        run: |
          mkdir -p clang
          cd clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz --strip-components=1
          cd ..
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Set up GCC cross compilers
        run: |
          mkdir -p gcc64 gcc32
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz -O gcc64.tar.gz || \
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Merge base defconfig with chime fragment
        run: |
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/gcc32/bin/arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$(pwd)/clang/bin:$PATH

          scripts/kconfig/merge_config.sh -O out \
            arch/arm64/configs/vendor/bengal_defconfig \
            arch/arm64/configs/vendor/xiaomi/chime.config

      - name: Enable ath9k_htc driver options
        run: |
          cd out
          sed -i '/CONFIG_ATH9K_HTC/d' .config
          sed -i '/CONFIG_ATH9K_HW/d' .config
          sed -i '/CONFIG_ATH9K_COMMON/d' .config
          sed -i '/CONFIG_ATH_COMMON/d' .config
          cat >> .config << 'EOF'
          CONFIG_ATH_COMMON=m
          CONFIG_ATH9K_HW=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH9K_HTC=m
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          EOF
          cd ..

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/gcc32/bin/arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$(pwd)/clang/bin:$PATH

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            olddefconfig

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 2>&1 | tee build.log

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn

      - name: Upload ath9k_htc module (if built as .ko)
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-htc-module
          path: |
            out/**/ath9k_htc.ko
            out/**/ath9k.ko
          if-no-files-found: warn
