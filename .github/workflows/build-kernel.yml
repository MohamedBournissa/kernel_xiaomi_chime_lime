name: Build lime Kernel with ath9k_htc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ursinia
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev libelf-dev dwarves \
            python3 python-is-python3

      - name: Download Clang toolchain
        run: |
          mkdir -p clang
          cd clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz --strip-components=1
          cd ..
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Set up GCC cross compilers
        run: |
          set -e
          echo "--- Cloning aarch64 (64-bit) GCC toolchain (pinned to pre-LLVM-migration commit) ---"
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          cd gcc64
          git checkout 236a853
          cd ..

          echo "--- Cloning arm (32-bit) GCC toolchain (pinned to pre-LLVM-migration commit) ---"
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
          cd gcc32
          git checkout $(git rev-list -n 1 --before="2020-01-01" HEAD)
          cd ..

          echo "--- Verifying gcc64 compiler binary exists and is executable ---"
          GCC64_BIN="$(pwd)/gcc64/bin/aarch64-linux-android-gcc"
          if [ ! -x "$GCC64_BIN" ]; then
            echo "ERROR: $GCC64_BIN not found or not executable."
            echo "Contents of gcc64/bin:"
            ls -la gcc64/bin/ 2>&1 || echo "gcc64/bin does not even exist"
            exit 1
          fi
          echo "Confirmed: $GCC64_BIN exists and is executable."
          "$GCC64_BIN" --version

          echo "--- Verifying gcc32 compiler binary exists and is executable ---"
          GCC32_BIN="$(pwd)/gcc32/bin/arm-linux-androideabi-gcc"
          if [ ! -x "$GCC32_BIN" ]; then
            echo "ERROR: $GCC32_BIN not found or not executable."
            echo "Contents of gcc32/bin:"
            ls -la gcc32/bin/ 2>&1 || echo "gcc32/bin does not even exist"
            exit 1
          fi
          echo "Confirmed: $GCC32_BIN exists and is executable."
          "$GCC32_BIN" --version

      - name: Merge base defconfig with chime fragment
        run: |
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/gcc32/bin/arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$(pwd)/clang/bin:$PATH

          echo "--- Verifying source config files exist before merging ---"
          BASE_DEFCONFIG="arch/arm64/configs/vendor/bengal_defconfig"
          FRAGMENT_CONFIG="arch/arm64/configs/vendor/xiaomi/chime.config"

          if [ ! -f "$BASE_DEFCONFIG" ]; then
            echo "ERROR: Base defconfig not found at $BASE_DEFCONFIG"
            echo "Searching for it elsewhere in the tree..."
            find . -name "bengal_defconfig" 2>/dev/null
            exit 1
          fi
          if [ ! -f "$FRAGMENT_CONFIG" ]; then
            echo "ERROR: Fragment config not found at $FRAGMENT_CONFIG"
            echo "Searching for it elsewhere in the tree..."
            find . -name "chime.config" 2>/dev/null
            exit 1
          fi

          echo "Both source files confirmed present. Proceeding with merge."
          echo "Base defconfig line count: $(wc -l < $BASE_DEFCONFIG)"
          echo "Fragment config line count: $(wc -l < $FRAGMENT_CONFIG)"

          scripts/kconfig/merge_config.sh -m -O out \
            "$BASE_DEFCONFIG" \
            "$FRAGMENT_CONFIG"

          echo "--- Searching for the resulting .config file ---"
          find . -maxdepth 3 -name ".config" -exec ls -la {} \;
          echo "--- .config line count if it exists ---"
          find . -maxdepth 3 -name ".config" -exec wc -l {} \;

      - name: Enable ath9k_htc driver options
        run: |
          CONFIG_FILE=$(find . -maxdepth 3 -name ".config" | head -n 1)
          echo "Using config file at: $CONFIG_FILE"

          if [ -z "$CONFIG_FILE" ]; then
            echo "ERROR: No .config file found anywhere. Aborting."
            exit 1
          fi

          sed -i '/CONFIG_ATH9K_HTC/d' "$CONFIG_FILE"
          sed -i '/CONFIG_ATH9K_HW/d' "$CONFIG_FILE"
          sed -i '/CONFIG_ATH9K_COMMON/d' "$CONFIG_FILE"
          sed -i '/CONFIG_ATH_COMMON/d' "$CONFIG_FILE"
          sed -i '/CONFIG_DM_CRYPT/d' "$CONFIG_FILE"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_ATH_COMMON=m
          CONFIG_ATH9K_HW=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH9K_HTC=m
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          # CONFIG_DM_CRYPT is not set
          EOF

          echo "--- Patching wcd-mbhc-v2.c to remove the broken switch_dev_unregister call ---"
          MBHC_FILE="techpack/audio/asoc/codecs/wcd-mbhc-v2.c"
          if [ -f "$MBHC_FILE" ]; then
            sed -i '/switch_dev_unregister(&accdet_data);/d' "$MBHC_FILE"
            echo "Patched: removed broken switch_dev_unregister line from $MBHC_FILE"
            grep -n "switch_dev_unregister" "$MBHC_FILE" || echo "Confirmed: no remaining references to switch_dev_unregister in this file."
          else
            echo "WARNING: $MBHC_FILE not found at expected path. Searching..."
            find . -name "wcd-mbhc-v2.c" 2>/dev/null
          fi

          echo "--- Resolving FT8719 driver duplicate-symbol conflict (keeping BOTH drivers, since Redmi 9T ships with either nt36672a or ft8719 panels depending on batch) ---"
          FT8719_DIR="drivers/input/touchscreen/FT8719"
          TOUCH_DIR="drivers/input/touchscreen/focaltech_touch"
          if [ -d "$FT8719_DIR" ] && [ -d "$TOUCH_DIR" ]; then
            echo "--- Extracting ALL globally-visible fts_/fw_file/module_list/fwupgrade symbols anywhere under FT8719 (recursive) ---"
            SYMS=$(grep -rhoE '\b(fts_[A-Za-z0-9_]+|fw_file|module_list|fwupgrade)\b' "$FT8719_DIR" 2>/dev/null | sort -u)
            SYMS=$(printf '%s\nfw_file\nmodule_list\nfwupgrade\nfts_data\n' "$SYMS" | sort -u)

            echo "Symbols to rename under $FT8719_DIR:"
            echo "$SYMS"

            while IFS= read -r -d '' f; do
              while IFS= read -r sym; do
                [ -z "$sym" ] && continue
                sed -i -E "s/\\b${sym}\\b/ft8719v2_${sym}/g" "$f"
              done <<< "$SYMS"
              sed -i -E 's/\bdev_attr_(fts_[A-Za-z0-9_]+)\b/dev_attr_ft8719v2_\1/g' "$f"
              sed -i -E 's/DEVICE_ATTR\((fts_[A-Za-z0-9_]+)\b/DEVICE_ATTR(ft8719v2_\1/g' "$f"
            done < <(find "$FT8719_DIR" -type f \( -name '*.c' -o -name '*.h' \) -print0)

            echo "--- Verifying: searching for any remaining un-prefixed fts_/fw_file/module_list/fwupgrade/dev_attr_fts symbols anywhere under FT8719 ---"
            grep -rnE '\b(fts_[A-Za-z0-9_]+|fw_file|module_list|fwupgrade|dev_attr_fts_[A-Za-z0-9_]+)\b' "$FT8719_DIR" | grep -v 'ft8719v2_' && \
              echo "WARNING: un-prefixed symbols still found above, may still conflict" || \
              echo "Confirmed: all fts_/fw_file/module_list/fwupgrade/dev_attr_fts symbols under $FT8719_DIR are now prefixed."

            echo "Renamed conflicting symbols under $FT8719_DIR to avoid multiple-definition linker errors."
          else
            echo "WARNING: $FT8719_DIR or $TOUCH_DIR not found. Searching for them..."
            find . -type d -name "FT8719" 2>/dev/null
            find . -type d -name "focaltech_touch" 2>/dev/null
          fi

          echo "--- Resolving NT36672A driver duplicate-symbol conflict (same pattern as FT8719, different touchscreen vendor) ---"
          NT_DIR="drivers/input/touchscreen/NT36672A"
          NT_OTHER_DIR="drivers/input/touchscreen/nt36xxx"
          if [ -d "$NT_DIR" ] && [ -d "$NT_OTHER_DIR" ]; then
            echo "--- Extracting ALL globally-visible nvt_ function AND variable names defined in the NT36672A copy ---"
            NT_SYMS=$(grep -hoE '\bnvt_[A-Za-z0-9_]+\b' "$NT_DIR"/*.c "$NT_DIR"/*.h 2>/dev/null | sort -u)

            echo "Symbols to rename in $NT_DIR:"
            echo "$NT_SYMS"

            for f in "$NT_DIR"/*.c "$NT_DIR"/*.h; do
              [ -f "$f" ] || continue
              while IFS= read -r sym; do
                [ -z "$sym" ] && continue
                sed -i -E "s/\\b${sym}\\b/nt36672av2_${sym}/g" "$f"
              done <<< "$NT_SYMS"
            done

            echo "--- Verifying: searching for any remaining un-prefixed nvt_ symbols in NT36672A dir ---"
            grep -rnE '\bnvt_[A-Za-z0-9_]+\b' "$NT_DIR" | grep -v 'nt36672av2_' && \
              echo "WARNING: un-prefixed nvt_ symbols still found above, may still conflict" || \
              echo "Confirmed: all nvt_ symbols in $NT_DIR are now prefixed."

            echo "Renamed conflicting symbols in $NT_DIR to avoid multiple-definition linker errors."
          else
            echo "WARNING: $NT_DIR or $NT_OTHER_DIR not found. Searching for them..."
            find . -type d -name "NT36672A" 2>/dev/null
            find . -type d -name "nt36xxx" 2>/dev/null
          fi

          # Ensure the file also exists at out/.config for the build step,
          # regardless of where merge_config.sh actually placed it.
          mkdir -p out
          if [ "$CONFIG_FILE" != "./out/.config" ]; then
            cp "$CONFIG_FILE" out/.config
          fi

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/gcc32/bin/arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$(pwd)/clang/bin:$PATH

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            olddefconfig

          set -o pipefail
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-pointer-types" \
            2>&1 | tee build.log

          MAKE_EXIT_CODE=$?
          echo "--- make exited with code: $MAKE_EXIT_CODE ---"

          echo "--- Checking for the final kernel Image ---"
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: out/arch/arm64/boot/Image was NOT produced."
            echo "Last 50 lines of build.log for context:"
            tail -n 50 build.log
            exit 1
          fi

          echo "SUCCESS: out/arch/arm64/boot/Image exists."
          ls -la out/arch/arm64/boot/

          if [ "$MAKE_EXIT_CODE" -ne 0 ]; then
            echo "WARNING: make reported exit code $MAKE_EXIT_CODE but Image exists anyway. Proceeding with caution."
          fi

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn

      - name: Upload ath9k_htc module (if built as .ko)
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-htc-module
          path: |
            out/**/ath9k_htc.ko
            out/**/ath9k.ko
          if-no-files-found: warn
